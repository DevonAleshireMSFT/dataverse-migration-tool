name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET backend build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend
        run: dotnet restore src/backend

      - name: Build backend
        run: dotnet build src/backend --configuration Release --no-restore

      - name: Test backend
        run: dotnet test src/backend --configuration Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory TestResults

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  code-app:
    name: Code App lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Code App
        run: npm run lint

      - name: Build Code App
        run: npm run build
